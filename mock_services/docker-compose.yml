version: "3.9"

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - product-service
      - order-service

  auth-service:
    build: ./auth-service

  product-service:
    build: ./product-service
    depends_on:
      - inventory-service

  inventory-service:
    build: ./inventory-service

  order-service:
    build: ./order-service
    depends_on:
      - inventory-service
      - payment-service

  payment-service:
    build: ./payment-service

  # Load is generated externally via k6 — see k6/README.md
